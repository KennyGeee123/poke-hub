<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PokéRegions — Mini Adventure</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { touch-action: manipulation; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  body {
    background: radial-gradient(ellipse at top, #1a2a18 0%, #0b1220 70%);
    color: #f4efe4;
    font-family: 'Barlow', 'Courier New', monospace;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    padding: 12px;
    image-rendering: pixelated;
  }
  #app { display: flex; gap: 16px; align-items: stretch; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 860px; }

  #dpad {
    position: fixed;
    left: 16px;
    bottom: 16px;
    width: 168px;
    height: 168px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 6px;
    z-index: 50;
    touch-action: none;
  }
  #dpad button {
    background: rgba(12, 24, 18, 0.92);
    border: 3px solid #9bbc0f;
    color: #9bbc0f;
    font-size: 28px;
    font-weight: bold;
    border-radius: 8px;
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #dpad button:active { background: #9bbc0f; color: #0f380f; transform: scale(0.95); }
  #dpad .up    { grid-column: 2; grid-row: 1; }
  #dpad .left  { grid-column: 1; grid-row: 2; }
  #dpad .mid   { grid-column: 2; grid-row: 2; background: transparent; border: none; pointer-events: none; }
  #dpad .right { grid-column: 3; grid-row: 2; }
  #dpad .down  { grid-column: 2; grid-row: 3; }
  @media (min-width: 900px) and (hover: hover) and (pointer: fine) {
    #dpad { display: none; }
  }
  @media (max-width: 560px) {
    canvas { width: 320px !important; height: 320px !important; }
    #sidebar { width: 100%; max-width: 340px; max-height: 220px; }
    body { padding: 8px; padding-bottom: 200px; align-items: flex-start; }
  }
  #game-wrap {
    position: relative;
    border: 4px solid #1a1a1a;
    border-radius: 10px;
    background: #142018;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45), inset 0 0 0 2px #306230;
    flex: 1 1 512px;
    max-width: 640px;
  }
  #region-label {
    position: absolute;
    top: 14px; left: 50%;
    transform: translateX(-50%) translateY(-6px);
    background: #f4efe4;
    color: #0b1220;
    padding: 10px 22px;
    border-radius: 4px;
    font-weight: 800;
    letter-spacing: 3px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .4s, transform .4s;
    z-index: 10;
    border: 4px solid #cc2b2b;
    box-shadow: 0 6px 0 #1a1a1a;
    font-size: 18px;
    text-transform: uppercase;
    font-family: 'Bebas Neue', Impact, sans-serif;
  }
  #region-label.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  canvas { display: block; background: #2e3b2e; width: 100%; height: auto; aspect-ratio: 1 / 1; }
  #sidebar {
    width: 240px;
    background: #f4efe4;
    border: 4px solid #1a1a1a;
    border-radius: 10px;
    padding: 12px;
    max-height: 512px;
    overflow-y: auto;
    color: #1a1a1a;
    box-shadow: 0 8px 24px rgba(0,0,0,.3);

  #sidebar h2 {
    color: #cc2b2b;
    font-size: 18px;
    margin-bottom: 10px;
    text-align: center;

  #modal-msg { margin: 10px 0; min-height: 22px; font-weight: 700; color: #0f380f; }
  #modal-buttons { display: flex; gap: 12px; justify-content: center; margin-top: 12px; }
  #modal-buttons button {
    flex: 1;
    padding: 12px 10px;
    border: 3px solid #1a1a1a;
    border-radius: 4px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;

  }
  #btn-fight { background: #cc2b2b; color: #f4efe4; }
  #btn-run { background: #121a2b; color: #f4efe4; }
  #btn-close { background: #306230; color: #9bbc0f; width: 100%; border: 3px solid #0f380f; padding: 12px; font-weight: 800; cursor: pointer; font-family: inherit; }
  .hidden { display: none !important; }
  #flash {
    position: absolute; inset: 0;
    background: #fff176;
    opacity: 0;
    pointer-events: none;

  #badge-row { display:flex; gap:6px; justify-content:center; margin:8px 0 10px; }
  .badge-slot { width:28px; height:28px; border-radius:50%; border:2px solid #1a1a1a; background:#d9d0c0; display:grid; place-items:center; font-size:14px; opacity:.35; }
  .badge-slot.on { opacity:1; box-shadow:0 0 0 2px #e2b53a; }
  #minimap { width:160px; height:160px; image-rendering:pixelated; border:3px solid #1a1a1a; display:block; margin:0 auto 10px; background:#142018; }

  #dpad .mid { background:rgba(12,24,18,.92); border:3px solid #e2b53a; color:#e2b53a; pointer-events:auto; font-size:11px; letter-spacing:0; }

<body>

<script>

const TILE = 32;
const VIEW_TILES = 16;
const MAP_SIZE = 20;
const CANVAS_PX = VIEW_TILES * TILE;

const POKEMON = [
  { name: "Bulbasaur",  emoji: "🌱", color: "#78c850" },
  { name: "Charmander", emoji: "🔥", color: "#f08030" },

  { name: "Jynx",       emoji: "💜", color: "#c084fc" },
  { name: "Onix",       emoji: "🪨", color: "#a8a878" },

const GYMS = [
  { id: "boulder", name: "Pewter Gym", leader: "Brock", type: "Rock", badge: "Boulder", mon: "Onix", level: 14, emoji: "🪨" },
  { id: "cascade", name: "Cerulean Gym", leader: "Misty", type: "Water", badge: "Cascade", mon: "Squirtle", level: 16, emoji: "💧" },
  { id: "thunder", name: "Vermilion Gym", leader: "Lt. Surge", type: "Electric", badge: "Thunder", mon: "Pikachu", level: 18, emoji: "⚡" },
  { id: "volcano", name: "Cinnabar Gym", leader: "Blaine", type: "Fire", badge: "Volcano", mon: "Charmander", level: 20, emoji: "🔥" },
];
const E4 = [
  { leader: "Lorelei", type: "Ice", mon: "Jynx", level: 24, kind: "elite" },
  { leader: "Bruno", type: "Fighting", mon: "Machop", level: 26, kind: "elite" },
  { leader: "Agatha", type: "Ghost", mon: "Gastly", level: 28, kind: "elite" },
  { leader: "Lance", type: "Dragon", mon: "Dratini", level: 30, kind: "elite" },
  { leader: "Champion", type: "Psychic", mon: "Mewtwo", level: 32, kind: "champion" },
];

const CH = { '.':0,'g':1,'T':2,'X':3,'G':4,'P':5,'W':6,'f':7,'H':8,'E':9,'F':10,'s':11,'#':12,'1':13,'2':14,'3':15,'4':16,'5':17 };

function parseMap(str) {
  const rows = str.trim().split('\n').map(r => r.trim());
  if (rows.length !== 20) throw new Error('map rows ' + rows.length);
  return rows.map(r => {
    if (r.length !== 20) throw new Error('row len ' + r.length + ' ' + r);
    return [...r].map(c => CH[c] ?? 2);
  });
}

const MAPS = [
parseMap(`
TTTTTTTTTTTTTTTTTTTT
TX......gggggg....XT

`),
parseMap(`

TX................XT
TTTTTTTTTTTTTTTTTTTT
`),
parseMap(`
####################

#.....ssssssss.....#
#..FFFF............#
#..HHHH....fffff...#
#..HHHH............#
#.............G....#

#.......gggg.......#
#..................#
#X................X#
####################
`),
parseMap(`
####################
#X....ss##ssss....X#
#.....ss##ssss.....#

`),
parseMap(`

];

const REGION_NAMES = ["Pewter", "Cerulean", "Vermilion", "Cinnabar", "Indigo"];
const REGION_TINT = ["#c4a574", "#7cb342", "#e0a060", "#8d4a32", "#4a5080"];

const NPCS = [
  { region: 0, x: 8, y: 8, color: "#3b6ea5", quote: "PEWTER GYM is the stone dojo. Beat BROCK for the Boulder Badge." },
  { region: 1, x: 7, y: 7, color: "#2a9d8f", quote: "MISTY's gym sits by the water. Bring Grass or Electric." },
  { region: 2, x: 6, y: 8, color: "#e9c46a", quote: "LT. SURGE hits hard. Ground types would help — if you had one." },
  { region: 3, x: 8, y: 8, color: "#e76f51", quote: "BLAINE's volcano gym is last. Then INDIGO to the north." },
  { region: 4, x: 10, y: 14, color: "#7c3aed", quote: "Four badges to enter. Lorelei, Bruno, Agatha, Lance, then the Champion." },
];

function spriteUrl(name) {
  const slug = String(name).toLowerCase().replace(/[♀♂.'']/g, '').replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
  return `https://play.pokemonshowdown.com/sprites/ani/${slug}.gif`;
}
function staticSpriteUrl(name) {
  const slug = String(name).toLowerCase().replace(/[^a-z0-9-]/g, '');
  return `https://play.pokemonshowdown.com/sprites/gen5/${slug}.png`;
}

const MapManager = {
  regions: MAPS,
  current: 0,
  get map() { return this.regions[this.current]; },
  name() { return REGION_NAMES[this.current]; },
  gym() { return GYMS[this.current] || null; },
  tileAt(x, y) {
    if (x < 0 || y < 0 || x >= MAP_SIZE || y >= MAP_SIZE) return 12;
    return this.map[y][x];
  },
  switchRegion(dir) {
    if (dir === 'N') this.current = Math.min(this.regions.length - 1, this.current + 1);
    else if (dir === 'S') this.current = Math.max(0, this.current - 1);
    else this.current = (this.current + (dir === 'E' ? 1 : this.regions.length - 1)) % this.regions.length;
    const mid = Math.floor(MAP_SIZE / 2);
    if (dir === 'N') return { x: mid, y: MAP_SIZE - 2 };
    if (dir === 'S') return { x: mid, y: 1 };
    if (dir === 'W') return { x: MAP_SIZE - 2, y: mid };
    if (dir === 'E') return { x: 1, y: mid };
    return { x: mid, y: mid };
  }
};

function facingTile() {
  let dx = 0, dy = 0;
  if (Player.facing === 'up') dy = -1;
  else if (Player.facing === 'down') dy = 1;
  else if (Player.facing === 'left') dx = -1;
  else dx = 1;
  return { x: Player.x + dx, y: Player.y + dy, t: MapManager.tileAt(Player.x + dx, Player.y + dy) };
}

const Player = {
  x: 10, y: 10,
  frozen: false,
  facing: 'down',
  tryMove(dx, dy) {
    if (this.frozen) return;
    if (dy < 0) this.facing = 'up';
    else if (dy > 0) this.facing = 'down';
    else if (dx < 0) this.facing = 'left';
    else if (dx > 0) this.facing = 'right';
    const nx = this.x + dx, ny = this.y + dy;
    const t = MapManager.tileAt(nx, ny);
    if ([2, 8, 10, 12, 9].includes(t)) return;
    if (t === 3) {
      let dir = 'N';
      if (ny >= MAP_SIZE - 1) dir = 'S';
      else if (ny <= 0) dir = 'N';
      else if (nx >= MAP_SIZE - 1) dir = 'E';
      else if (nx <= 0) dir = 'W';
      let next = MapManager.current;
      if (dir === 'N') next = Math.min(REGION_NAMES.length - 1, next + 1);
      else if (dir === 'S') next = Math.max(0, next - 1);
      else next = (next + (dir === 'E' ? 1 : REGION_NAMES.length - 1)) % REGION_NAMES.length;
      if (next === 4 && MapManager.current !== 4 && (SaveSystem.state.badges || []).length < 4) {
        UIManager.toastModal("INDIGO PLATEAU", "The Elite Four gates are sealed. Earn 4 gym badges first.");
        return;
      }
      const spawn = MapManager.switchRegion(dir);
      this.x = spawn.x; this.y = spawn.y;
      UIManager.showRegionLabel(MapManager.name());
      postStatus();
      SaveSystem.save();
      return;
    }
    this.x = nx; this.y = ny;
    if (t === 1) EncounterSystem.tryEncounter();
    else if (t === 4) Sites.gym();
    else if (t === 5) Sites.center();
    else if (t >= 13 && t <= 17) Sites.elite(t - 13);
    SaveSystem.save();
  },
  interact() {
    if (this.frozen) return;
    const { x, y, t } = facingTile();
    const npc = NPCS.find(n => n.region === MapManager.current && n.x === x && n.y === y);
    if (npc) { UIManager.toastModal("TOWNSFOLK", npc.quote); return; }
    if (t === 4) Sites.gym();
    else if (t === 5) Sites.center();
    else if (t >= 13 && t <= 17) Sites.elite(t - 13);
  }
};

const AudioFX = {
  ctx: null,
  ensure() {
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e) { this.ctx = null; }
    }
  },
  rustle() {
    this.ensure();
    if (!this.ctx) return;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(880, this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(220, this.ctx.currentTime + 0.25);
    g.gain.setValueAtTime(0.15, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.3);
  }
};

function postParent(msg) {
  try { window.parent && window.parent.postMessage(msg, "*"); } catch (_) {}
}
function postStatus() {
  postParent({
    type: "pv-adventure-status",
    region: MapManager.name(),
    badges: SaveSystem.state.badges || [],
    e4: SaveSystem.state.e4 || 0,
  });
  postParent({ type: "pv-adventure-region", name: MapManager.name() });
}

const EncounterSystem = {
  current: null,
  tryEncounter() {
    if (Math.random() > 0.18) return;
    const poke = POKEMON[Math.floor(Math.random() * (POKEMON.length - 2))];
    this.current = { ...poke, kind: "wild", level: 5 + MapManager.current * 3 + Math.floor(Math.random() * 4) };
    Player.frozen = true;
    AudioFX.rustle();
    UIManager.flash();
    if (!SaveSystem.state.caught.find(c => c.name === poke.name)) {
      SaveSystem.state.caught.push({ name: poke.name, emoji: poke.emoji, color: poke.color });
      SaveSystem.save();
      UIManager.renderPokedex();
    }
    UIManager.openWild(this.current);
  },
  close() {
    this.current = null;
    Player.frozen = false;
    UIManager.closeModal();
  },
  fight() {
    const poke = this.current;
    if (!poke) { this.close(); return; }
    postParent({
      type: "pv-adventure-encounter",
      name: poke.name,
      region: MapManager.name(),
      level: poke.level,
      kind: poke.kind || "wild",
      catchable: poke.kind === "wild",
      leader: poke.leader,
      badge: poke.badge,
    });
    UIManager.openBattleHandoff(poke);
  },
  run() { this.close(); },
};

const Sites = {
  gym() {
    const g = MapManager.gym();
    if (!g) return;
    if ((SaveSystem.state.badges || []).includes(g.badge)) {
      UIManager.toastModal(g.name, "The GYM LEADER is out. You already earned the " + g.badge + " Badge.");
      return;
    }
    EncounterSystem.current = { name: g.mon, emoji: g.emoji, color: "#e2b53a", kind: "gym", level: g.level, leader: g.leader, badge: g.badge };
    Player.frozen = true;
    UIManager.openTrainer("GYM CHALLENGE", g.leader + " the " + g.type + " trainer", g.mon,
      "Fight for the " + g.badge + " Badge?");
  },
  center() {
    Player.frozen = true;
    postParent({ type: "pv-adventure-heal" });
    UIManager.toastModal("POKé CENTER", "Your party was healed. Take a breath, then get back out there.");
  },
  elite(idx) {
    const badges = SaveSystem.state.badges || [];
    if (badges.length < 4) {
      UIManager.toastModal("INDIGO PLATEAU", "Four gym badges are required to challenge the Elite Four.");
      return;
    }
    const beaten = SaveSystem.state.e4 || 0;
    if (idx > beaten) {
      UIManager.toastModal("SEALED DOOR", "Beat the previous Elite Four member first.");
      return;
    }
    if (idx < beaten) {
      UIManager.toastModal("CHAMBER", "Already conquered. The next door waits.");
      return;
    }
    const e = E4[idx];
    EncounterSystem.current = { name: e.mon, emoji: "◆", color: "#7c3aed", kind: e.kind, level: e.level, leader: e.leader, e4Index: idx };
    Player.frozen = true;
    UIManager.openTrainer(e.kind === "champion" ? "CHAMPION BATTLE" : "ELITE FOUR",
      e.leader + " · " + e.type, e.mon, "This is a trainer battle. You cannot catch their Pokémon.");
  }
};

const UIManager = {
  canvas: document.getElementById('game'),
  mini: document.getElementById('minimap'),
  ctx: null, mctx: null,
  modal: document.getElementById('modal-bg'),
  init() {
    this.ctx = this.canvas.getContext('2d');
    this.mctx = this.mini.getContext('2d');
    document.getElementById('btn-fight').onclick = () => EncounterSystem.fight();
    document.getElementById('btn-run').onclick   = () => EncounterSystem.run();
    document.getElementById('btn-close').onclick = () => EncounterSystem.close();
    document.getElementById('reset-btn').onclick = () => {
      if (confirm('Reset all progress?')) {
        localStorage.removeItem('pokeregions-save');
        location.reload();
      }
    };
    this.renderBadges();
  },
  showRegionLabel(name) {
    const el = document.getElementById('region-label');
    el.textContent = name.toUpperCase();
    el.classList.add('show');
    clearTimeout(this._rt);
    this._rt = setTimeout(() => el.classList.remove('show'), 1800);
  },
  flash() {
    const f = document.getElementById('flash');
    f.classList.add('on');
    setTimeout(() => f.classList.remove('on'), 200);
  },
  setSprite(name) {
    const sp = document.getElementById('poke-sprite');
    sp.innerHTML = `<img src="${spriteUrl(name)}" alt="${name}" onerror="this.onerror=null;this.src='${staticSpriteUrl(name)}';" />`;
  },
  openWild(poke) {
    document.getElementById('modal-title').textContent = 'A wild Pokémon appeared!';
    this.setSprite(poke.name);
    document.getElementById('poke-name').textContent = poke.name + '  Lv' + poke.level;
    document.getElementById('modal-msg').textContent = 'FIGHT opens Game Boy · RUN stays in the grass';
    document.getElementById('btn-fight').classList.remove('hidden');
    document.getElementById('btn-run').classList.remove('hidden');
    document.getElementById('modal-buttons').classList.remove('hidden');
    document.getElementById('btn-close').classList.add('hidden');
    this.modal.classList.add('active');
  },
  openTrainer(title, subtitle, mon, msg) {
    document.getElementById('modal-title').textContent = title;
    this.setSprite(mon);
    document.getElementById('poke-name').textContent = subtitle;
    document.getElementById('modal-msg').textContent = msg;
    document.getElementById('btn-fight').classList.remove('hidden');
    document.getElementById('btn-run').classList.remove('hidden');
    document.getElementById('btn-run').textContent = 'Leave';
    document.getElementById('modal-buttons').classList.remove('hidden');
    document.getElementById('btn-close').classList.add('hidden');
    this.modal.classList.add('active');
  },
  toastModal(title, msg) {
    Player.frozen = true;
    document.getElementById('modal-title').textContent = title;
    document.getElementById('poke-sprite').textContent = '◆';
    document.getElementById('poke-name').textContent = '';
    document.getElementById('modal-msg').textContent = msg;
    document.getElementById('modal-buttons').classList.add('hidden');
    document.getElementById('btn-close').classList.remove('hidden');
    document.getElementById('btn-close').textContent = 'Continue';
    this.modal.classList.add('active');
  },
  openBattleHandoff(poke) {
    const trainer = poke.kind && poke.kind !== 'wild';
    document.getElementById('modal-title').textContent = trainer ? '⚔ TRAINER BATTLE' : '⚔ GAME BOY BATTLE!';
    this.setSprite(poke.name);
    document.getElementById('poke-name').textContent = (poke.leader ? poke.leader + "'s " : "Wild ") + poke.name;
    document.getElementById('modal-msg').textContent = 'Game Boy is opening. Win there to earn the badge.';
    document.getElementById('modal-buttons').classList.add('hidden');
    document.getElementById('btn-close').classList.remove('hidden');
    document.getElementById('btn-close').textContent = 'Continue Exploring';
    const m = document.getElementById('modal');
    m.style.background = '#9bbc0f';
    m.style.color = '#0f380f';
    m.style.borderColor = '#0f380f';
    this.modal.classList.add('active');
  },
  closeModal() {
    this.modal.classList.remove('active');
    const m = document.getElementById('modal');
    m.style.background = ''; m.style.color = ''; m.style.borderColor = '';
    document.getElementById('btn-run').textContent = 'Run';
    Player.frozen = false;
  },
  renderPokedex() {
    const ul = document.getElementById('pokedex-list');
    const empty = document.getElementById('empty');
    ul.innerHTML = '';
    const caught = SaveSystem.state.caught;
    if (!caught.length) { empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    caught.forEach((p, i) => {
      const li = document.createElement('li');
      li.innerHTML = `<span class="dot" style="background:${p.color}"></span>
                      <img src="${spriteUrl(p.name)}" alt="" onerror="this.onerror=null;this.src='${staticSpriteUrl(p.name)}';" />
                      <span>${String(i+1).padStart(3,'0')} ${p.name}</span>`;
      ul.appendChild(li);
    });
  },
  renderBadges() {
    const row = document.getElementById('badge-row');
    const have = SaveSystem.state.badges || [];
    row.innerHTML = GYMS.map(g =>
      `<div class="badge-slot ${have.includes(g.badge) ? 'on' : ''}" title="${g.badge}">${g.emoji}</div>`
    ).join('');
    const pips = document.getElementById('e4-pips');
    const n = SaveSystem.state.e4 || 0;
    pips.innerHTML = E4.map((e, i) =>
      `<div class="e4-pip ${i < n ? 'on' : ''} ${i === 4 && i < n ? 'champ' : ''}" title="${e.leader}"></div>`
    ).join('');
  },
  drawMini() {
    const ctx = this.mctx;
    if (!ctx) return;
    const s = 160 / MAP_SIZE;
    for (let y = 0; y < MAP_SIZE; y++) {
      for (let x = 0; x < MAP_SIZE; x++) {
        const t = MapManager.tileAt(x, y);
        ctx.fillStyle = ({
          0:'#c4a574',1:'#2e7d32',2:'#1b5e20',3:'#e2b53a',4:'#cc2b2b',5:'#f48fb1',
          6:'#1e88e5',7:'#ec407a',8:'#6d4c41',9:'#4527a0',10:'#5d4037',11:'#e0c068',
          12:'#263238',13:'#7c3aed',14:'#fb8c00',15:'#6a1b9a',16:'#c62828',17:'#ffd54f'
        })[t] || '#142018';
        ctx.fillRect(x * s, y * s, s, s);
      }
    }
    ctx.fillStyle = '#fff';
    ctx.fillRect(Player.x * s, Player.y * s, s, s);
    ctx.fillStyle = '#cc2b2b';
    ctx.fillRect(Player.x * s + 1, Player.y * s + 1, Math.max(2, s - 2), Math.max(2, s - 2));
  },
  draw() {
    const ctx = this.ctx;
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, CANVAS_PX, CANVAS_PX);
    const halfV = Math.floor(VIEW_TILES / 2);
    const camX = Player.x - halfV;
    const camY = Player.y - halfV;
    const overlays = [];
    for (let vy = 0; vy < VIEW_TILES; vy++) {
      for (let vx = 0; vx < VIEW_TILES; vx++) {
        const mx = camX + vx, my = camY + vy;
        const px = vx * TILE, py = vy * TILE;
        const t = MapManager.tileAt(mx, my);
        this.drawTile(ctx, t, px, py, mx, my);
        if ([2, 4, 5, 8, 9].includes(t) || (t >= 13 && t <= 17)) overlays.push({ t, px, py, mx, my });
      }
    }
    NPCS.filter(n => n.region === MapManager.current).forEach(n => {
      const px = (n.x - camX) * TILE, py = (n.y - camY) * TILE;
      if (px < -32 || py < -32 || px > CANVAS_PX || py > CANVAS_PX) return;
      this.drawNpc(ctx, px, py, n.color);
    });
    this.drawTrainer(ctx, halfV * TILE, halfV * TILE, Player.facing);
    overlays.forEach(o => {
      if (o.my < Player.y) return;
      if (o.t === 2) this.drawTreeTop(ctx, o.px, o.py);
      if (o.t === 4 || o.t === 5 || o.t === 8) this.drawRoof(ctx, o.t, o.px, o.py);
    });
    ctx.fillStyle = 'rgba(10,16,28,.18)';
    ctx.fillRect(0, 0, CANVAS_PX, 28);
    this.drawMini();
  },
  drawNpc(ctx, px, py, color) {
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath(); ctx.ellipse(px + 16, py + 30, 8, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = color;
    ctx.fillRect(px + 10, py + 12, 12, 12);
    ctx.fillStyle = '#f0c8a0';
    ctx.fillRect(px + 11, py + 4, 10, 9);
  },
  drawTrainer(ctx, ppx, ppy, facing) {
    const bob = (Date.now() / 180) % 2 < 1 ? 0 : 1;
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(ppx + 16, ppy + 30, 10, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a2744';
    ctx.fillRect(ppx + 9, ppy + 22 + bob, 6, 8);
    ctx.fillRect(ppx + 17, ppy + 22 + (1 - bob), 6, 8);
    ctx.fillStyle = '#cc2b2b';
    ctx.fillRect(ppx + 8, ppy + 28 + bob, 8, 3);
    ctx.fillRect(ppx + 16, ppy + 28 + (1 - bob), 8, 3);
    ctx.fillStyle = '#cc2b2b';
    ctx.fillRect(ppx + 8, ppy + 12, 16, 12);
    ctx.fillStyle = '#f4efe4';
    ctx.fillRect(ppx + 13, ppy + 14, 6, 8);
    ctx.fillStyle = '#e2b53a';
    ctx.fillRect(ppx + (facing === 'left' ? 20 : 6), ppy + 14, 6, 9);
    ctx.fillStyle = '#f0c8a0';
    ctx.fillRect(ppx + 10, ppy + 4, 12, 10);
    ctx.fillStyle = '#cc2b2b';
    ctx.fillRect(ppx + 8, ppy + 1, 16, 6);
    ctx.fillStyle = '#f4efe4';
    ctx.fillRect(ppx + 13, ppy + 3, 6, 3);
    ctx.fillStyle = '#1a1a1a';
    if (facing === 'down' || facing === 'right') ctx.fillRect(ppx + 18, ppy + 8, 2, 2);
    if (facing === 'down' || facing === 'left') ctx.fillRect(ppx + 12, ppy + 8, 2, 2);
  },
  drawTreeTop(ctx, px, py) {
    ctx.fillStyle = '#1b5e20';
    ctx.beginPath(); ctx.arc(px + 16, py + 10, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2e7d32';
    ctx.beginPath(); ctx.arc(px + 16, py + 8, 11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#81c784';
    ctx.beginPath(); ctx.arc(px + 11, py + 6, 4, 0, Math.PI * 2); ctx.fill();
  },
  drawRoof(ctx, t, px, py) {
    ctx.fillStyle = t === 5 ? '#f48fb1' : t === 4 ? '#cc2b2b' : '#6d4c41';
    ctx.beginPath();
    ctx.moveTo(px - 2, py + 10);
    ctx.lineTo(px + 16, py - 8);
    ctx.lineTo(px + 34, py + 10);
    ctx.closePath();
    ctx.fill();
  },
  drawTile(ctx, t, px, py, mx, my) {
    if (mx < 0 || my < 0 || mx >= MAP_SIZE || my >= MAP_SIZE) {
      ctx.fillStyle = '#0b1220';
      ctx.fillRect(px, py, TILE, TILE);
      return;
    }
    const hash = ((mx * 13) ^ (my * 31)) & 7;
    const sway = Math.sin(Date.now() / 420 + mx * 0.4 + my * 0.3) * 2;
    const tint = REGION_TINT[MapManager.current];
    const ground = (t === 1 || t === 7) ? '#2e7d32' : (t === 6) ? '#1565c0' : (t === 11) ? '#e0c068' : tint;
    if ([0,1,7,11,3].includes(t)) {
      ctx.fillStyle = t === 1 || t === 7 ? '#388e3c' : ground;
      ctx.fillRect(px, py, TILE, TILE);
    }
    if (t === 0 || t === 3) {
      ctx.fillStyle = tint;
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = 'rgba(255,255,255,.12)';
      ctx.fillRect(px, py, TILE, 2);
      ctx.fillStyle = 'rgba(0,0,0,.12)';
      ctx.fillRect(px + 6 + hash, py + 12, 4, 2);
      if (t === 3) {
        ctx.fillStyle = '#e2b53a';
        ctx.fillRect(px + 8, py + 8, 16, 16);
        ctx.fillStyle = '#0b1220';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('▶', px + 16, py + 16);
      }
    } else if (t === 1) {
      ctx.fillStyle = '#1b5e20';
      ctx.fillRect(px, py + 22, TILE, 10);
      ctx.fillStyle = '#66bb6a';
      ctx.fillRect(px + 4 + sway, py + 6, 3, 14);
      ctx.fillRect(px + 12, py + 4, 3, 16);
      ctx.fillRect(px + 20 - sway, py + 8, 3, 13);
      ctx.fillStyle = '#c5e1a5';
      ctx.fillRect(px + 5 + sway, py + 6, 2, 3);
    } else if (t === 7) {
      ctx.fillStyle = '#43a047';
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = hash % 2 ? '#ec407a' : '#ffd54f';
      ctx.beginPath(); ctx.arc(px + 8, py + 10, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(px + 20, py + 18, 3, 0, Math.PI * 2); ctx.fill();
    } else if (t === 6) {
      ctx.fillStyle = '#1565c0';
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = 'rgba(255,255,255,.25)';
      const w = (Date.now() / 200 + my) % 16;
      ctx.fillRect(px, py + w, TILE, 2);
      ctx.fillRect(px, py + ((w + 8) % 16) + 8, TILE, 2);
    } else if (t === 11) {
      ctx.fillStyle = '#e0c068';
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#d4b888';
      ctx.fillRect(px + hash, py + 8, 3, 3);
    } else if (t === 2) {
      ctx.fillStyle = '#3e2723';
      ctx.fillRect(px + 13, py + 18, 6, 14);
      this.drawTreeTop(ctx, px, py);
    } else if (t === 10) {
      ctx.fillStyle = tint;
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#5d4037';
      ctx.fillRect(px, py + 10, TILE, 8);
      ctx.fillStyle = '#a1887f';
      ctx.fillRect(px + 4, py + 8, 3, 12);
      ctx.fillRect(px + 16, py + 8, 3, 12);
    } else if (t === 12) {
      ctx.fillStyle = '#37474f';
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#263238';
      ctx.fillRect(px, py, TILE, 6);
      ctx.fillStyle = '#90a4ae';
      ctx.fillRect(px + 2, py + 8, 8, 3);
    } else if (t === 8) {
      ctx.fillStyle = '#8d6e63';
      ctx.fillRect(px + 2, py + 10, 28, 22);
      ctx.fillStyle = '#5d4037';
      ctx.fillRect(px + 12, py + 20, 8, 12);
      ctx.fillStyle = '#81d4fa';
      ctx.fillRect(px + 6, py + 14, 6, 6);
      this.drawRoof(ctx, 8, px, py);
    } else if (t === 4) {
      ctx.fillStyle = '#bcaaa4';
      ctx.fillRect(px + 1, py + 8, 30, 24);
      ctx.fillStyle = '#3e2723';
      ctx.fillRect(px + 12, py + 18, 8, 14);
      ctx.fillStyle = '#e2b53a';
      ctx.fillRect(px + 8, py + 10, 16, 5);
      this.drawRoof(ctx, 4, px, py);
    } else if (t === 5) {
      ctx.fillStyle = '#fafafa';
      ctx.fillRect(px + 1, py + 8, 30, 24);
      ctx.fillStyle = '#e53935';
      ctx.fillRect(px + 13, py + 12, 6, 14);
      ctx.fillRect(px + 9, py + 16, 14, 6);
      this.drawRoof(ctx, 5, px, py);
    } else if (t === 9) {
      ctx.fillStyle = '#311b92';
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#e2b53a';
      ctx.fillRect(px + 6, py + 6, 20, 20);
      ctx.fillStyle = '#0b1220';
      ctx.fillRect(px + 10, py + 10, 12, 16);
    } else if (t >= 13 && t <= 17) {
      const cols = ['#7c3aed','#fb8c00','#6a1b9a','#c62828','#ffd54f'];
      ctx.fillStyle = '#1a1333';
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = cols[t - 13];
      ctx.fillRect(px + 6, py + 4, 20, 24);
      ctx.fillStyle = '#0b1220';
      ctx.fillRect(px + 11, py + 12, 10, 16);
    }
  }
};

const SaveSystem = {
  KEY: 'pokeregions-save',
  state: { x: 10, y: 10, region: 0, caught: [], badges: [], e4: 0 },
  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) {
        const s = JSON.parse(raw);
        this.state = Object.assign(this.state, { badges: [], e4: 0 }, s);
        Player.x = s.x ?? 10;
        Player.y = s.y ?? 10;
        MapManager.current = Math.min(MAPS.length - 1, s.region ?? 0);
      }
    } catch (e) { console.warn('Load failed', e); }
  },
  save() {
    this.state.x = Player.x;
    this.state.y = Player.y;
    this.state.region = MapManager.current;
    try { localStorage.setItem(this.KEY, JSON.stringify(this.state)); } catch(e){}
    UIManager.renderBadges();
    postStatus();
  }
};

const Input = {
  lastMove: 0,
  init() {
    document.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        Player.interact();
        return;
      }
      const now = Date.now();
      if (now - this.lastMove < 90) return;
      let handled = true;
      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W': Player.tryMove(0, -1); break;
        case 'ArrowDown': case 's': case 'S': Player.tryMove(0, 1); break;
        case 'ArrowLeft': case 'a': case 'A': Player.tryMove(-1, 0); break;
        case 'ArrowRight': case 'd': case 'D': Player.tryMove(1, 0); break;
        default: handled = false;
      }
      if (handled) { this.lastMove = now; e.preventDefault(); }
    });
    const dirMap = { up: [0,-1], down: [0,1], left: [-1,0], right: [1,0] };
    const move = (dir) => {
      const v = dirMap[dir]; if (!v) return;
      const now = Date.now();
      if (now - this.lastMove < 90) return;
      this.lastMove = now;
      Player.tryMove(v[0], v[1]);
    };
    document.querySelectorAll('#dpad button[data-dir]').forEach(btn => {
      const dir = btn.getAttribute('data-dir');
      let holdTimer = null, repeatTimer = null;
      const start = (e) => {
        e.preventDefault();
        move(dir);
        holdTimer = setTimeout(() => { repeatTimer = setInterval(() => move(dir), 110); }, 220);
      };
      const stop = (e) => {
        if (e) e.preventDefault();
        clearTimeout(holdTimer); clearInterval(repeatTimer);
        holdTimer = repeatTimer = null;
      };
      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', stop, { passive: false });
      btn.addEventListener('touchcancel', stop, { passive: false });
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', stop);
      btn.addEventListener('mouseleave', stop);
    });
    const act = document.querySelector('#dpad [data-act="interact"]');
    if (act) {
      const fire = (e) => { e.preventDefault(); Player.interact(); };
      act.addEventListener('touchstart', fire, { passive: false });
      act.addEventListener('mousedown', fire);
    }
  }
};

function loop() {
  UIManager.draw();
  requestAnimationFrame(loop);
}

window.addEventListener('load', () => {
  UIManager.init();
  SaveSystem.load();
  UIManager.renderPokedex();
  UIManager.renderBadges();
  UIManager.showRegionLabel(MapManager.name());
  postStatus();
  Input.init();
  loop();
});

window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d) return;
  if (d.type === 'pv-adventure-resume') EncounterSystem.close();
  if (d.type === 'pv-adventure-badge' && d.badge) {
    const b = SaveSystem.state.badges || (SaveSystem.state.badges = []);
    if (!b.includes(d.badge)) b.push(d.badge);
    SaveSystem.save();
    UIManager.toastModal(d.badge.toUpperCase() + " BADGE", "You earned the " + d.badge + " Badge!");
  }
  if (d.type === 'pv-adventure-e4-won') {
    SaveSystem.state.e4 = Math.max(SaveSystem.state.e4 || 0, (d.index ?? 0) + 1);
    SaveSystem.save();
    const next = E4[SaveSystem.state.e4];
    UIManager.toastModal("CHAMBER CLEARED", next ? (next.leader + " is next.") : "You are the Champion.");
  }
});

</script>
</body>
</html>
